          : \"complaint_type\",\n    \"投诉子类\": \"complaint_subtype\",\n    \"客户等级\"\
          : \"customer_level\",\n    \"客户反馈\": \"customer_feedback\",\n    \"客户姓名\"\
          : \"customer_name\",\n    \"客户名称\": \"customer_name\",\n    \"customer_name\"\
          : \"customer_name\"\n}\n\n# 各表强制输出字段顺序\nTABLE_COLUMN_ORDER: Dict[str, List[str]]\
          \ = {\n    \"complaint_record\": [\n        \"complaint_id\", \"accept_time\"\
          , \"customer_id\", \"handler_name\",\n        \"package_type\", \"complaint_description\"\
          , \"complaint_type\", \"complaint_subtype\"\n    ],\n    \"complaint_handling\"\
          : [\n        \"complaint_id\", \"handler_id\", \"hall_id\", \"accept_time\"\
          ,\n        \"customer_feedback\", \"customer_name\"\n    ],\n    \"customer_info\"\
          : [\n        \"customer_id\", \"customer_name\", \"customer_level\"\n  \
          \  ],\n    \"employee_info\": [\n        \"handler_id\", \"handler_name\"\
          , \"hall_id\"\n    ],\n    \"hall_info\": [\n        \"hall_id\", \"hall_name\"\
          , \"region\"\n    ]\n}\n# ==========================================================\n\
          \n\ndef normalize_header(raw_header: str) -> str:\n    \"\"\"\n    标准化表头：去除空格、转小写、匹配映射字典\n\
          \    \"\"\"\n    s = raw_header.strip().lower()\n    s = re.sub(r\"\\s+\"\
          , \"\", s)\n    if s in COLUMN_MAPPING:\n        return COLUMN_MAPPING[s]\n\
          \    # 已经是蛇形命名直接返回\n    snake_check = re.fullmatch(r\"[a-z_]+\", s)\n  \
          \  if snake_check:\n        return s\n    # 未命中映射原样返回(后续作为额外字段)\n    return\
          \ raw_header.strip()\n\n\ndef parse_markdown_table(md_text: str):\n    \"\
          \"\"\n    解析markdown表格，返回 headers, rows\n    \"\"\"\n    lines = [line.rstrip()\
          \ for line in md_text.splitlines() if line.strip()]\n    if len(lines) <\
          \ 2:\n        return [], []\n    # 跳过分隔行 |---|---|\n    header_line = lines[0]\n\
          \    data_lines = []\n    for ln in lines[1:]:\n        if re.fullmatch(r\"\
          [\\|\\-\\s]+\", ln):\n            continue\n        data_lines.append(ln)\n\
          \n    def split_pipe(line: str) -> List[str]:\n        parts = [p.strip()\
          \ for p in line.split(\"|\")]\n        return [p for p in parts if p]\n\n\
          \    headers = split_pipe(header_line)\n    rows = [split_pipe(dl) for dl\
          \ in data_lines]\n    return headers, rows\n\n\ndef build_markdown_table(headers:\
          \ List[str], rows: List[List[str]]) -> str:\n    \"\"\"\n    根据表头和行数据生成标准markdown表格\n\
          \    \"\"\"\n    out_lines = []\n    out_lines.append(\"| \" + \" | \".join(headers)\
          \ + \" |\")\n    out_lines.append(\"| \" + \" | \".join([\"---\"] * len(headers))\
          \ + \" |\")\n    for r in rows:\n        out_lines.append(\"| \" + \" |\
          \ \".join(r) + \" |\")\n    return \"\\n\".join(out_lines)\n\n\ndef detect_table_name(mapped_headers:\
          \ List[str]) -> str | None:\n    \"\"\"\n    通过表头字段集合匹配判断属于哪一张表\n    返回表标识\
          \ complaint_record / complaint_handling / customer_info / employee_info\
          \ / hall_info\n    \"\"\"\n    set_h = set(mapped_headers)\n    for table_name,\
          \ order_list in TABLE_COLUMN_ORDER.items():\n        required = set(order_list)\n\
          \        hit = set_h & required\n        if len(hit) >= 2:\n           \
          \ return table_name\n    return None\n\n\ndef reorder_columns(headers_mapped:\
          \ List[str], rows: List[List[str]], table_name: str):\n    \"\"\"\n    按标准顺序重排列，额外字段追加到末尾\n\
          \    \"\"\"\n    std_order = TABLE_COLUMN_ORDER[table_name]\n    # 构建原始表头\
          \ -> 索引\n    header2idx = {h: i for i, h in enumerate(headers_mapped)}\n\
          \n    new_header = []\n    new_col_index = []\n    # 先放标准字段(存在就加入)\n   \
          \ for col in std_order:\n        if col in header2idx and col not in new_header:\n\
          \            new_header.append(col)\n            new_col_index.append(header2idx[col])\n\
          \    # 剩余额外字段追加到尾部\n    for idx, h in enumerate(headers_mapped):\n     \
          \   if h not in new_header:\n            new_header.append(h)\n        \
          \    new_col_index.append(idx)\n    # 重排每一行单元格数据\n    new_rows = []\n  \
          \  for row in rows:\n        new_row = [row[i] if i < len(row) else \"\"\
          \ for i in new_col_index]\n        new_rows.append(new_row)\n    return\
          \ new_header, new_rows\n\n\ndef main(arr: str) -> dict:\n    \"\"\"\n  \
          \  Dify入口主函数\n    :param arr: 输入markdown表格文本字符串\n    :return: {\"result\"\
          : 输出markdown表格文本}\n    \"\"\"\n    raw_headers, data_rows = parse_markdown_table(arr)\n\
          \    if not raw_headers:\n        return {\"result\": arr}\n\n    # 表头标准化映射\n\
          \    mapped_headers = [normalize_header(h) for h in raw_headers]\n    #\
          \ 识别表类型\n    table_name = detect_table_name(mapped_headers)\n    if table_name\
          \ and table_name in TABLE_COLUMN_ORDER:\n        final_headers, final_rows\
          \ = reorder_columns(mapped_headers, data_rows, table_name)\n    else:\n\
          \        # 无法识别表：仅做表头重命名，不调整顺序\n        final_headers = mapped_headers\n\
          \        final_rows = data_rows\n\n    result = build_markdown_table(final_headers,\
          \ final_rows)\n    return {\"result\": result}"
        code_language: python3
