    - data:
        code: "def main(o1: str, o2: str, o3: str, o4: str, o5: str,\n         n1:\
          \ str, n2: str, n3: str, n4: str, n5: str) -> str:\n    \"\"\"\n    Dify\
          \ Python 代码节点主函数\n    输入：10个markdown文本，分别对应5张表的原始文档(o_i)和处理后文档(n_i)\n  \
          \  输出：综合数据清洗变更报告的markdown文本\n    \"\"\"\n    # 表名映射\n    table_names = [\n\
          \        \"complaint_record\",\n        \"complaint_handling\",\n      \
          \  \"customer_info\",\n        \"employee_info\",\n        \"hall_info\"\
          \n    ]\n    originals = [o1, o2, o3, o4, o5]\n    new_docs = [n1, n2, n3,\
          \ n4, n5]\n\n    def parse_markdown_table(text: str):\n        \"\"\"解析markdown表格，返回(表头列表,\
          \ 数据行列表)（数据行最多3行）\"\"\"\n        lines = text.splitlines()\n        lines\
          \ = [line.strip() for line in lines if line.strip()]\n        headers =\
          \ []\n        rows = []\n        # 寻找第一个以|开头和结尾的行作为表头\n        header_line\
          \ = None\n        for line in lines:\n            if line.startswith('|')\
          \ and line.endswith('|'):\n                header_line = line\n        \
          \        break\n        if not header_line:\n            return headers,\
          \ rows\n\n        headers = [cell.strip() for cell in header_line.split('|')[1:-1]]\n\
          \n        # 找到数据行（跳过包含---的分隔行）\n        data_lines = []\n        sep_found\
          \ = False\n        for line in lines[lines.index(header_line)+1:]:\n   \
          \         if not (line.startswith('|') and line.endswith('|')):\n      \
          \          continue\n            if '---' in line:\n                sep_found\
          \ = True\n                continue\n            if sep_found:\n        \
          \        data_lines.append(line)\n            else:\n                # 若未找到分隔行，保守处理全部当作数据行\n\
          \                data_lines.append(line)\n\n        for line in data_lines[:3]:\n\
          \            cells = [cell.strip() for cell in line.split('|')[1:-1]]\n\
          \            if len(cells) < len(headers):\n                cells += ['']\
          \ * (len(headers) - len(cells))\n            rows.append(cells)\n\n    \
          \    return headers, rows\n\n    # 构建报告\n    report = \"# 数据清洗变更报告\\n\\\
          n\"\n\n    for idx, table_name in enumerate(table_names):\n        o_headers,\
          \ _ = parse_markdown_table(originals[idx])\n        n_headers, n_rows =\
          \ parse_markdown_table(new_docs[idx])\n\n        original_cols = ', '.join(o_headers)\
          \ if o_headers else '（未识别到列名）'\n        standard_cols = ', '.join(n_headers)\
          \ if n_headers else '（未识别到列名）'\n\n        report += f\"## 表：{table_name}\\\
          n\"\n        report += f\"- 原列名：{original_cols}\\n\"\n        report +=\
          \ f\"- 标准列名：{standard_cols}\\n\"\n        # 关键修改：将预览标题独立成段落，并添加空行，使表格能被正确渲染\n\
          \        report += \"\\n- 结果预览（前3行）：\\n\\n\"\n        if n_rows and n_headers:\n\
          \            # 构建表格（表头 + 分隔线 + 数据行）\n            table_str = \"| \" + \"\
          \ | \".join(n_headers) + \" |\\n\"\n            table_str += \"| \" + \"\
          \ | \".join(['---'] * len(n_headers)) + \" |\\n\"\n            for row in\
          \ n_rows:\n                table_str += \"| \" + \" | \".join(row) + \"\
          \ |\\n\"\n            report += table_str\n        else:\n            report\
          \ += \"（无数据预览）\\n\"\n        report += \"\\n\"  # 表格后留空行，与下一张表分隔\n\n   \
          \ return {\"result\":report}"
