    - data:
        code: "import json\nimport datetime\nimport re\nfrom collections import defaultdict\n\
          from typing import List, Dict, Optional, Any\n\n\ndef parse_markdown_table(text:\
          \ str) -> List[Dict[str, str]]:\n    \"\"\"\n    解析 Markdown 表格，返回列表字典。\n\
          \    支持标准格式：表头行、分隔行、数据行。\n    \"\"\"\n    lines = [line.strip() for line\
          \ in text.strip().splitlines() if line.strip()]\n    if len(lines) < 2:\n\
          \        return []\n\n    # 寻找分隔行（包含 ---）\n    sep_idx = None\n    for i,\
          \ line in enumerate(lines):\n        if re.search(r'\\|?\\s*---+\\s*\\|',\
          \ line):\n            sep_idx = i\n            break\n\n    if sep_idx is\
          \ None:\n        header_line = lines[0]\n        data_lines = lines[1:]\n\
          \    else:\n        header_line = lines[0]\n        data_lines = lines[sep_idx\
          \ + 1:]\n\n    # 解析表头\n    headers = [h.strip() for h in header_line.split('|')\
          \ if h.strip() != '']\n    rows = []\n    for line in data_lines:\n    \
          \    cells = [c.strip() for c in line.split('|')]\n        # 去除首尾可能因行首尾\
          \ | 产生的空字符串\n        if cells and cells[0] == '':\n            cells = cells[1:]\n\
          \        if cells and cells[-1] == '':\n            cells = cells[:-1]\n\
          \        # 补齐或截断至表头长度\n        if len(cells) < len(headers):\n         \
          \   cells += [''] * (len(headers) - len(cells))\n        elif len(cells)\
          \ > len(headers):\n            cells = cells[:len(headers)]\n        rows.append(dict(zip(headers,\
          \ cells)))\n    return rows\n\n\ndef parse_timestamp(ts_str: str) -> Optional[datetime.datetime]:\n\
          \    \"\"\"尝试多种常见时间格式解析，返回 datetime 或 None\"\"\"\n    formats = [\n    \
          \    '%Y-%m-%d %H:%M:%S',\n        '%Y-%m-%d %H:%M:%S.%f',\n        '%Y-%m-%dT%H:%M:%S',\n\
          \        '%Y-%m-%dT%H:%M:%S.%f',\n        '%Y/%m/%d %H:%M:%S',\n       \
          \ '%Y-%m-%d %H:%M',\n    ]\n    for fmt in formats:\n        try:\n    \
          \        return datetime.datetime.strptime(ts_str, fmt)\n        except\
          \ ValueError:\n            continue\n    return None\n\n\ndef main(alarms:\
          \ str, device_topology: str) -> Dict[str, Any]:\n    \"\"\"\n    Dify 代码执行节点入口函数。\n\
          \    输入：告警文件内容（Markdown 表格）、拓扑文件内容（Markdown 表格）\n    输出：evidence_pack, topology_mermaid,\
          \ dispatch_queries, validation_errors\n    \"\"\"\n    # 初始返回值（无 active\
          \ 告警时保持）\n    result = {\n        'evidence_pack': '[]',\n        'topology_mermaid':\
          \ '',\n        'dispatch_queries': [],\n        'validation_errors': []\
          \   # 新增：存放校验错误信息\n    }\n\n    # ---------- 1. 输入非空校验 ----------\n    if\
          \ not alarms or not alarms.strip():\n        result['validation_errors'].append(\"\
          告警文件为空\")\n        return result\n    if not device_topology or not device_topology.strip():\n\
          \        result['validation_errors'].append(\"拓扑文件为空\")\n        return\
          \ result\n\n    # ---------- 2. 解析表格 ----------\n    try:\n        alarm_rows\
          \ = parse_markdown_table(alarms)\n        topo_rows = parse_markdown_table(device_topology)\n\
          \    except Exception as e:\n        result['validation_errors'].append(f\"\
          解析表格失败: {str(e)}\")\n        return result\n\n    # ---------- 3. 字段完整性校验\
          \ ----------\n    required_alarm_fields = {'timestamp', 'device_id', 'device_type',\
          \ 'domain', 'alarm_type', 'severity', 'status'}\n    if not alarm_rows:\n\
          \        result['validation_errors'].append(\"告警文件无数据\")\n        return\
          \ result\n    missing = required_alarm_fields - set(alarm_rows[0].keys())\n\
          \    if missing:\n        result['validation_errors'].append(f\"告警文件缺少字段:\
          \ {','.join(missing)}\")\n        return result\n\n    required_topo_fields\
          \ = {'device_id', 'device_type', 'domain', 'parent_device_id'}\n    if not\
          \ topo_rows:\n        result['validation_errors'].append(\"拓扑文件无数据\")\n\
          \        return result\n    missing_topo = required_topo_fields - set(topo_rows[0].keys())\n\
          \    if missing_topo:\n        result['validation_errors'].append(f\"拓扑文件缺少字段:\
          \ {','.join(missing_topo)}\")\n        return result\n\n    # ----------\
          \ 4. 过滤 active 告警 ----------\n    active_alarms = [row for row in alarm_rows\
          \ if row.get('status', '').strip().lower() == 'active']\n    if not active_alarms:\n\
          \        # 无 active 告警，视为正常，无错误，直接返回\n        return result\n\n    # ----------\
          \ 5. 构建拓扑设备 ID 集合 ----------\n    topo_device_ids = {row.get('device_id',\
          \ '').strip() for row in topo_rows if row.get('device_id', '').strip()}\n\
          \n    # ---------- 6. 校验告警时间是否可解析 & 设备是否存在于拓扑表 ----------\n    invalid_time_alarms\
          \ = []\n    missing_device_alarms = []\n    valid_active_alarms = []\n\n\
          \    for row in active_alarms:\n        dev_id = row.get('device_id', '').strip()\n\
          \        ts_str = row.get('timestamp', '').strip()\n        # 时间解析校验\n \
          \       if not ts_str or parse_timestamp(ts_str) is None:\n            invalid_time_alarms.append(row)\n\
          \            continue\n        # 设备存在性校验\n        if dev_id not in topo_device_ids:\n\
          \            missing_device_alarms.append(row)\n            continue\n \
          \       valid_active_alarms.append(row)\n\n    # 收集错误信息\n    if invalid_time_alarms:\n\
          \        sample_ids = [row.get('device_id', '') for row in invalid_time_alarms[:3]]\n\
          \        result['validation_errors'].append(\n            f\"存在 {len(invalid_time_alarms)}\
          \ 条告警的时间格式无法解析，例如设备 {', '.join(sample_ids)}\"\n        )\n    if missing_device_alarms:\n\
          \        sample_ids = [row.get('device_id', '') for row in missing_device_alarms[:3]]\n\
          \        result['validation_errors'].append(\n            f\"存在 {len(missing_device_alarms)}\
          \ 条告警的设备不在拓扑表中，例如设备 {', '.join(sample_ids)}\"\n        )\n\n    # 如果存在校验错误，直接返回（其他输出保持初始空值）\n\
          \    if result['validation_errors']:\n        return result\n\n    # 用有效告警覆盖原\
          \ active_alarms\n    active_alarms = valid_active_alarms\n    if not active_alarms:\n\
          \        return result  # 无有效 active 告警\n\n    # ---------- 7. 构建拓扑关系 ----------\n\
          \    parent_of: Dict[str, Optional[str]] = {}\n    children_of: Dict[str,\
          \ List[str]] = defaultdict(list)\n    for row in topo_rows:\n        dev_id\
          \ = row.get('device_id', '').strip()\n        parent = row.get('parent_device_id',\
          \ '').strip() or None\n        if dev_id:\n            parent_of[dev_id]\
          \ = parent\n            if parent:\n                children_of[parent].append(dev_id)\n\
          \    for row in topo_rows:\n        dev_id = row.get('device_id', '').strip()\n\
          \        if dev_id and dev_id not in children_of:\n            children_of[dev_id]\
          \ = []\n\n    # ---------- 8. 严重级别映射 ----------\n    severity_order = {'critical':\
          \ 4, 'major': 3, 'minor': 2, 'warning': 1}\n\n    # ---------- 9. 按设备分组聚合\
          \ active 告警 ----------\n    device_groups: Dict[str, Dict] = defaultdict(lambda:\
          \ {\n        'device_type': '',\n        'domain': '',\n        'first_time':\
          \ None,\n        'max_severity': None,\n        'alarm_types': [],\n   \
          \     'alarm_rows': []\n    })\n\n    for row in active_alarms:\n      \
          \  dev_id = row.get('device_id', '').strip()\n        if not dev_id:\n \
          \           continue\n        ts_str = row.get('timestamp', '').strip()\n\
          \        ts = parse_timestamp(ts_str)\n        if ts is None:\n        \
          \    continue  # 已经校验过，理论上不会发生\n\n        severity = row.get('severity',\
          \ '').strip().lower()\n        alarm_type = row.get('alarm_type', '').strip()\n\
          \n        group = device_groups[dev_id]\n        group['device_type'] =\
          \ row.get('device_type', '').strip()\n        group['domain'] = row.get('domain',\
          \ '').strip()\n\n        if group['first_time'] is None or ts < group['first_time']:\n\
          \            group['first_time'] = ts\n\n        sev_val = severity_order.get(severity,\
          \ 0)\n        current_max = group['max_severity']\n        if current_max\
          \ is None or sev_val > severity_order.get(current_max, 0):\n           \
          \ group['max_severity'] = severity\n\n        if alarm_type and alarm_type\
          \ not in group['alarm_types']:\n            group['alarm_types'].append(alarm_type)\n\
          \n        group['alarm_rows'].append(row)\n\n    if not device_groups:\n\
          \        return result\n\n    # ---------- 10. 辅助函数（祖先/后代） ----------\n\
          \    def get_ancestors(dev_id: str) -> List[str]:\n        ancestors = []\n\
          \        current = dev_id\n        while current and current in parent_of:\n\
          \            parent = parent_of[current]\n            if parent is None:\n\
          \                break\n            ancestors.append(parent)\n         \
          \   current = parent\n        ancestors.reverse()\n        return ancestors\n\
          \n    def get_descendants(dev_id: str) -> List[str]:\n        descendants\
          \ = []\n        stack = list(children_of.get(dev_id, []))\n        while\
          \ stack:\n            child = stack.pop()\n            descendants.append(child)\n\
          \            stack.extend(children_of.get(child, []))\n        return descendants\n\
          \n    # ---------- 11. 构建 evidence_pack 和 dispatch_queries ----------\n\
          \    evidence_pack = []\n    dispatch_queries = []\n    related_nodes =\
          \ set()\n    edges = set()\n\n    for dev_id, group in device_groups.items():\n\
          \        parent = parent_of.get(dev_id)\n        direct_children = children_of.get(dev_id,\
          \ [])\n        all_descendants = get_descendants(dev_id)\n        ancestors\
          \ = get_ancestors(dev_id)\n\n        total_descendants = len(all_descendants)\n\
          \        impact_scope = f\"共 {total_descendants} 台下挂设备（含直接子节点）\"\n     \
          \   if direct_children:\n            impact_scope += f\"，直接子节点: {', '.join(direct_children)}\"\
          \n\n        alarm_phenomena = '、'.join(group['alarm_types']) if group['alarm_types']\
          \ else '无'\n        highest_sev = group['max_severity'] if group['max_severity']\
          \ else 'unknown'\n        first_time_str = group['first_time'].strftime('%Y-%m-%d\
          \ %H:%M:%S') if group['first_time'] else ''\n\n        record = {\n    \
          \        \"device_id\": dev_id,\n            \"device_type\": group['device_type'],\n\
          \            \"domain\": group['domain'],\n            \"first_alarm_time\"\
          : first_time_str,\n            \"highest_severity\": highest_sev,\n    \
          \        \"alarm_phenomena\": alarm_phenomena,\n            \"parent_device_id\"\
          : parent if parent else \"无\",\n            \"direct_child_devices\": direct_children\
          \ if direct_children else [\"无\"],\n            \"impact_scope\": impact_scope\n\
          \        }\n        evidence_pack.append(record)\n\n        alarm_types_str\
          \ = ', '.join(group['alarm_types']) if group['alarm_types'] else ''\n  \
          \      query = f\"{group['device_type']} {group['domain']} {highest_sev}\
          \ {alarm_types_str}\".strip()\n        dispatch_queries.append(query)\n\n\
          \        related_nodes.add(dev_id)\n        for anc in ancestors:\n    \
          \        related_nodes.add(anc)\n        for desc in all_descendants:\n\
          \            related_nodes.add(desc)\n\n        for node in related_nodes:\n\
          \            p = parent_of.get(node)\n            if p and p in related_nodes:\n\
          \                edges.add((p, node))\n\n    # ---------- 12. 生成 Mermaid\
          \ 图 ----------\n    if related_nodes:\n        mermaid_lines = [\"graph\
          \ TD\"]\n        for node in sorted(related_nodes):\n            mermaid_lines.append(f\"\
          \    {node}[{node}]\")\n        for p, c in sorted(edges):\n           \
          \ mermaid_lines.append(f\"    {p} --> {c}\")\n        for dev_id in device_groups.keys():\n\
          \            if dev_id in related_nodes:\n                mermaid_lines.append(f\"\
          \    style {dev_id} fill:#ff6b6b,stroke:#333,stroke-width:2px\")\n     \
          \   topology_mermaid = \"\\n\".join(mermaid_lines)\n    else:\n        topology_mermaid\
          \ = \"\"\n\n    # ---------- 13. 构造返回值 ----------\n    result['evidence_pack']\
          \ = json.dumps(evidence_pack, ensure_ascii=False)\n    result['topology_mermaid']\
          \ = topology_mermaid\n    result['dispatch_queries'] = dispatch_queries\n\
          \    # validation_errors 保持为空列表\n    return result"
        code_language: python3
        outputs:
          dispatch_queries:
            children: null
            type: array[string]
          evidence_pack:
            children: null
            type: string
          topology_mermaid:
            children: null
            type: string
          validation_errors:
            children: null
            type: array[string]
